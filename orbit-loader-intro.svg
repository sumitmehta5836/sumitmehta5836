<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes drift1 { to { stroke-dashoffset: -765; } }
      @keyframes drift2 { to { stroke-dashoffset: 765; } }
      @keyframes drift3 { to { stroke-dashoffset: -765; } }
      @keyframes breathe {
        0%, 100% { r: 4; opacity: 0.9; }
        50%      { r: 7; opacity: 0.5; }
      }
      .ring       { transform-origin: 300px 200px; animation: spin 100s linear infinite; }
      .comet1     { animation: drift1 3.6s linear infinite; }
      .comet2     { animation: drift2 4.4s linear infinite; }
      .comet3     { animation: drift3 5.2s linear infinite; }
      .core       { animation: breathe 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="600" height="400" fill="#090a10"/>

  <circle class="ring" cx="300" cy="200" r="185" fill="none" stroke="#3a4160" stroke-width="1" stroke-dasharray="1 7" opacity="0.6"/>

  <g stroke="#5f6a99" stroke-width="1" fill="none" opacity="0.35">
    <ellipse cx="300" cy="200" rx="170" ry="60"/>
    <ellipse cx="300" cy="200" rx="170" ry="60" transform="rotate(60 300 200)"/>
    <ellipse cx="300" cy="200" rx="170" ry="60" transform="rotate(120 300 200)"/>
  </g>

  <g fill="none" stroke="#8ab4ff" stroke-width="2" filter="url(#soft-glow)">
    <ellipse class="comet1" cx="300" cy="200" rx="170" ry="60" stroke-dasharray="20 745"/>
    <ellipse class="comet2" cx="300" cy="200" rx="170" ry="60" transform="rotate(60 300 200)" stroke-dasharray="20 745"/>
    <ellipse class="comet3" cx="300" cy="200" rx="170" ry="60" transform="rotate(120 300 200)" stroke-dasharray="20 745"/>
  </g>

  <circle class="core" cx="300" cy="200" r="4" fill="#c9d6ff" filter="url(#soft-glow)"/>
</svg>
